  - info:
      name: Ratings
      type: http
      seq: 7
    http:
      method: GET
      url: http://51.250.0.63:5004/api/Teams/1/1/income
      auth: inherit
    runtime:
      scripts:
        - type: tests
          code: |-
            const validStatuses = [200];

            test("Статус-код должен быть допустимым", function() {
                expect(validStatuses).to.include(res.status);
            });


            test("Тело ответа не должно быть undefined или null", function() {
                expect(res.body).to.not.be.undefined;
                expect(res.body).to.not.be.null;
            });


            test("Ответ должен быть в формате JSON или содержать код ошибки", function() {

                if (res.status === 400) {

                    const isValidError = typeof res.body === 'number' || 
                                        (typeof res.body === 'object' && res.body !== null);
                    expect(isValidError).to.be.true;
                    
                    console.log(`❌ Ошибка ${res.status}: Код ошибки ${res.body}`);
                } else {

                    expect(res.headers['content-type']).to.include('application/json');
                }
            });


            if (res.status === 400 && typeof res.body === 'number') {
                test("Код ошибки должен быть в диапазоне 100000-999999", function() {
                    expect(res.body).to.be.within(100000, 999999);
                });
            }
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5

opencollection: 1.0.0
info:
  name: Zadanie
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: Companies
      type: http
      seq: 1
    http:
      method: GET
      url: '{{Base}}/api/Advertisements/companies'
      auth: inherit
    runtime:
      scripts:
        - type: tests
          code: |-
            test("Ответ должен быть массивом компаний", function() {
                expect(res.body).to.be.an('array');
            });

            test("Массив компаний не должен быть пустым", function() {
                expect(res.body.length).to.be.greaterThan(0);
            });

            test("Все paymentSum должны быть числами", function() {
                const allSums = [];
                res.body.forEach(company => {
                    if (company.paymentInfo && Array.isArray(company.paymentInfo)) {
                        company.paymentInfo.forEach(payment => {
                            if (payment.hasOwnProperty('paymentSum')) {
                                allSums.push(payment.paymentSum);
                            }
                        });
                    }
                });
                
                allSums.forEach(sum => {
                    expect(sum).to.be.a('number');
                    expect(isNaN(sum)).to.be.false; 
                    expect(sum).to.be.greaterThan(0); 
                });
                
            });


            test("Все paymentDate должны быть валидными датами", function() {
                const allDates = [];
                res.body.forEach(company => {
                    if (company.paymentInfo && Array.isArray(company.paymentInfo)) {
                        company.paymentInfo.forEach(payment => {
                            if (payment.hasOwnProperty('paymentDate')) {
                                allDates.push(payment.paymentDate);
                            }
                        });
                    }
                });
                
                allDates.forEach(dateStr => {
                    expect(dateStr).to.be.a('string');
                    
                    const date = new Date(dateStr);
                    expect(date.toString()).to.not.equal('Invalid Date');
                    expect(date.getFullYear()).to.be.greaterThan(2000);
                });
              
            });
            test("Все компании должны иметь обязательные поля", function() {
                const requiredFields = ['id', 'name', 'advertisementLink', 'paymentInfo'];
                res.body.forEach(company => {
                    requiredFields.forEach(field => {
                        expect(company).to.have.property(field);
                    });
                });
            });

            test("Все id компаний должны быть числами", function() {
                res.body.forEach(company => {
                    expect(company.id).to.be.a('number');
                });
            });
            test("Все названия компаний должны быть непустыми строками", function() {
                res.body.forEach(company => {
                    expect(company.name).to.be.a('string');
                    expect(company.name.length).to.be.greaterThan(0);
                });
            });
            test("Все id платежей должны быть числами", function() {
                res.body.forEach(company => {
                    if (company.paymentInfo && Array.isArray(company.paymentInfo)) {
                        company.paymentInfo.forEach(payment => {
                            if (payment.hasOwnProperty('id')) {
                                expect(payment.id).to.be.a('number');
                            }
                        });
                    }
                });
            });
      assertions:
        - expression: res.status
          operator: in
          value: '[200,201,204]'
        - expression: res.headers
          operator: isJson
          value: ''
        - expression: res.body
          operator: isNotEmpty
          value: ''
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
  - info:
      name: Filter
      type: http
      seq: 11
    http:
      method: GET
      url: '{{Base}}/api/Players/filter?filter=Alpha%20Squad'
      params:
        - name: filter
          value: Alpha%20Squad
          type: query
      auth: inherit
    runtime:
      scripts:
        - type: tests
          code: |-
            test("Ответ должен быть массивом", function() {
                expect(res.body).to.be.an('array');
            });

            test("Массив не должен быть пустым", function() {
                expect(res.body.length).to.be.greaterThan(0);
            });

            test("Каждый игрок должен иметь обязательные поля", function() {
                const fields = ['id', 'combinedName', 'name', 'surname', 'nickName', 'country', 'teamName'];
                res.body.forEach(player => {
                    fields.forEach(f => expect(player).to.have.property(f));
                });
            });

            test("Все id должны быть числами", function() {
                res.body.forEach(player => {
                    expect(player.id).to.be.a('number');
                });
            });

            test("Все id должны быть уникальными", function() {
                const ids = res.body.map(p => p.id);
                const uniqueIds = new Set(ids);
                expect(uniqueIds.size).to.equal(ids.length);
            });

            test("Все id должны идти по порядку от 1", function() {
                res.body.forEach((player, index) => {
                    expect(player.id).to.equal(index + 1);
                });
            });

            test("Все combinedName должны быть строками", function() {
                res.body.forEach(player => {
                    expect(player.combinedName).to.be.a('string');
                    expect(player.combinedName.length).to.be.greaterThan(0);
                });
            });

            test("Все name должны быть строками", function() {
                res.body.forEach(player => {
                    expect(player.name).to.be.a('string');
                    expect(player.name.length).to.be.greaterThan(0);
                });
            });

            test("Все surname должны быть строками", function() {
                res.body.forEach(player => {
                    expect(player.surname).to.be.a('string');
                    expect(player.surname.length).to.be.greaterThan(0);
                });
            });

            test("Все nickName должны быть строками", function() {
                res.body.forEach(player => {
                    expect(player.nickName).to.be.a('string');
                    expect(player.nickName.length).to.be.greaterThan(0);
                });
            });

            test("Все country должны быть строками", function() {
                res.body.forEach(player => {
                    expect(player.country).to.be.a('string');
                    expect(player.country.length).to.be.greaterThan(0);
                });
            });

            test("Все teamName должны быть строками", function() {
                res.body.forEach(player => {
                    expect(player.teamName).to.be.a('string');
                    expect(player.teamName.length).to.be.greaterThan(0);
                });
            });

            test("combinedName должен быть суммой name и surname", function() {
                res.body.forEach(player => {
                    const expected = player.name + " " + player.surname;
                    expect(player.combinedName).to.equal(expected);
                });
            });

            test("name и surname не должны совпадать", function() {
                res.body.forEach(player => {
                    expect(player.name).to.not.equal(player.surname);
                });
            });

            test("Все teamName должны быть из списка известных команд", function() {
                const knownTeams = [
                    'Alpha Squad', 'Dragon Force', 'Polar Bears', 'Storm Riders',
                    'Shadow Collective', 'Northern Alliance', 'Imperial Guard',
                    'Mythic Gaming', 'Aurora Esports', 'Quantum Gaming',
                    'Frost Giants', 'Titan Brigade', 'Celestial Team',
                    'Vanguard Esports', 'Nebula Warriors', 'Omega Team',
                    'Blaze Athletics', 'Monsoon Team', 'Spectral Gaming',
                    'Horizon Esports'
                ];
                res.body.forEach(player => {
                    expect(knownTeams).to.include(player.teamName);
                });
            });

            test("В каждой команде должно быть по 5 игроков", function() {
                const teamCounts = {};
                res.body.forEach(player => {
                    teamCounts[player.teamName] = (teamCounts[player.teamName] || 0) + 1;
                });
                Object.values(teamCounts).forEach(count => {
                    expect(count).to.equal(5);
                });
            });

            test("Названия команд должны быть уникальными", function() {
                const teams = res.body.map(p => p.teamName);
                const uniqueTeams = new Set(teams);
                expect(uniqueTeams.size).to.equal(teams.length / 5);
            });

            test("Все country должны быть строками и не пустыми", function() {
                res.body.forEach(player => {
                    expect(player.country).to.be.a('string');
                    expect(player.country.length).to.be.greaterThan(0);
                });
            });
            test("Все combinedName должны быть уникальными", function() {
                const names = res.body.map(p => p.combinedName);
                const uniqueNames = new Set(names);
                expect(uniqueNames.size).to.equal(names.length);
            });

            test("Все nickName должны быть уникальными", function() {
                const nickNames = res.body.map(p => p.nickName);
                const uniqueNickNames = new Set(nickNames);
                expect(uniqueNickNames.size).to.equal(nickNames.length);
            });
      assertions:
        - expression: res.headers
          operator: isJson
          value: ''
        - expression: res.status
          operator: in
          value: '[200]'

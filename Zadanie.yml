  - info:
      name: ID
      type: http
      seq: 3
    http:
      method: GET
      url: '{{Base}}/api/Tournaments/1'
      auth: inherit
    runtime:
      scripts:
        - type: tests
          code: |-
            test("Ответ должен содержать все основные поля турнира", function() {
                const requiredFields = ['id', 'name', 'organizer', 'startDate', 'endDate', 'teamParticipantInfos', 'tournamentPrizes'];
                requiredFields.forEach(field => {
                    expect(res.body).to.have.property(field);
                });
            });

            test("id турнира должен быть числом", function() {
                expect(res.body.id).to.be.a('number');
            });

            test("Название турнира должно быть строкой", function() {
                expect(res.body.name).to.be.a('string');
                expect(res.body.name.length).to.be.greaterThan(0);
            });

            test("Организатор должен быть строкой", function() {
                expect(res.body.organizer).to.be.a('string');
                expect(res.body.organizer.length).to.be.greaterThan(0);
            });
            test("Все даты должны быть валидными", function() {
                const dates = [res.body.startDate, res.body.endDate];
                
                dates.forEach(dateStr => {
                    expect(dateStr).to.be.a('string');
                    const date = new Date(dateStr);
                    expect(date.toString()).to.not.equal('Invalid Date');
                    expect(date.getFullYear()).to.be.greaterThan(2000);
                });
            });

            test("Дата начала должна быть раньше даты окончания", function() {
                const start = new Date(res.body.startDate);
                const end = new Date(res.body.endDate);
                expect(start.getTime()).to.be.lessThan(end.getTime());
            });
            test("teamParticipantInfos должен быть массивом", function() {
                expect(res.body.teamParticipantInfos).to.be.an('array');
            });

            test("Массив команд не должен быть пустым", function() {
                expect(res.body.teamParticipantInfos.length).to.be.greaterThan(0);
            });
            test("Все команды должны иметь обязательные поля", function() {
                const requiredFields = ['id', 'standing', 'place', 'teamId', 'teamName'];
                res.body.teamParticipantInfos.forEach(team => {
                    requiredFields.forEach(field => {
                        expect(team).to.have.property(field);
                    });
                });
            });
            test("Все standing должны быть числами", function() {
                res.body.teamParticipantInfos.forEach(team => {
                    expect(team.standing).to.be.a('number');
                    expect(team.standing).to.be.greaterThan(0);
                });
            });
            test("Все place должны быть числами", function() {
                res.body.teamParticipantInfos.forEach(team => {
                    expect(team.place).to.be.a('number');
                    expect(team.place).to.be.greaterThan(0);
                });
            });
            test("Все teamId должны быть числами", function() {
                res.body.teamParticipantInfos.forEach(team => {
                    expect(team.teamId).to.be.a('number');
                });
            });
            test("Все teamName должны быть строками", function() {
                res.body.teamParticipantInfos.forEach(team => {
                    expect(team.teamName).to.be.a('string');
                    expect(team.teamName.length).to.be.greaterThan(0);
                });
            });
            test("standing и place должны совпадать", function() {
                res.body.teamParticipantInfos.forEach(team => {
                    expect(team.standing).to.equal(team.place);
                });
            });
            test("Команды должны быть отсортированы по месту", function() {
                const places = res.body.teamParticipantInfos.map(t => t.place);
                const sortedPlaces = [...places].sort((a, b) => a - b);
                expect(places).to.deep.equal(sortedPlaces);
            });
            test("Все id команд должны быть уникальными", function() {
                const ids = res.body.teamParticipantInfos.map(t => t.id);
                const uniqueIds = new Set(ids);
                expect(uniqueIds.size).to.equal(ids.length);
            });
            test("tournamentPrizes должен быть массивом", function() {
                expect(res.body.tournamentPrizes).to.be.an('array');
            });

            test("Массив призов не должен быть пустым", function() {
                expect(res.body.tournamentPrizes.length).to.be.greaterThan(0);
            });
            test("Все призы должны иметь обязательные поля", function() {
                const requiredFields = ['id', 'place', 'prize'];
                res.body.tournamentPrizes.forEach(prize => {
                    requiredFields.forEach(field => {
                        expect(prize).to.have.property(field);
                    });
                });
            });
            test("Все id призов должны быть числами", function() {
                res.body.tournamentPrizes.forEach(prize => {
                    expect(prize.id).to.be.a('number');
                });
            });
            test("Все place у призов должны быть числами", function() {
                res.body.tournamentPrizes.forEach(prize => {
                    expect(prize.place).to.be.a('number');
                    expect(prize.place).to.be.greaterThan(0);
                });
            });
            test("Все prize должны быть числами", function() {
                res.body.tournamentPrizes.forEach(prize => {
                    expect(prize.prize).to.be.a('number');
                    expect(isNaN(prize.prize)).to.be.false;
                    expect(prize.prize).to.be.greaterThan(0);
                });
            });
            test("Призы должны быть отсортированы по месту", function() {
                const places = res.body.tournamentPrizes.map(p => p.place);
                const sortedPlaces = [...places].sort((a, b) => a - b);
                expect(places).to.deep.equal(sortedPlaces);
            });
            test("Призы должны уменьшаться с увеличением места", function() {
                for (let i = 1; i < res.body.tournamentPrizes.length; i++) {
                    const prev = res.body.tournamentPrizes[i - 1];
                    const curr = res.body.tournamentPrizes[i];
                    expect(prev.prize).to.be.at.least(curr.prize);
                }
            });

            test("Все id призов должны быть уникальными", function() {
                const ids = res.body.tournamentPrizes.map(p => p.id);
                const uniqueIds = new Set(ids);
                expect(uniqueIds.size).to.equal(ids.length);
            });
            test("Количество команд должно совпадать с количеством призов", function() {
                const teamsCount = res.body.teamParticipantInfos.length;
                const prizesCount = res.body.tournamentPrizes.length;
                expect(teamsCount).to.equal(prizesCount);
            });
            test("Места команд должны совпадать с местами призов", function() {
                const teamPlaces = res.body.teamParticipantInfos.map(t => t.place);
                const prizePlaces = res.body.tournamentPrizes.map(p => p.place);
                expect(teamPlaces).to.deep.equal(prizePlaces);
            });
            test("Общая сумма призов должна быть положительной", function() {
                const totalPrize = res.body.tournamentPrizes.reduce((sum, p) => sum + p.prize, 0);
                expect(totalPrize).to.be.greaterThan(0);
            });
      assertions:
        - expression: res.status
          operator: in
          value: '[200]'
        - expression: res.headers
          operator: isJson
          value: ''
